# Alternative to scripts/db-local.sh for machines with Docker.
# DATABASE_URL=postgres://mutinai:mutinai@127.0.0.1:54329/mutinai
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mutinai
      POSTGRES_PASSWORD: mutinai
      POSTGRES_DB: mutinai
    ports: ["54329:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/docker-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
volumes:
  pgdata:
